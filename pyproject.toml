[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-benchmark"
version = "0.1.0"
description = "Independent local AI model benchmarking and evaluation service."
requires-python = ">=3.12"

dependencies = [
    "httpx",
    "sqlalchemy",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pip-tools",
    "ruff",
    "alembic",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = [
    "."
]